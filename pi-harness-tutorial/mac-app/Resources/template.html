<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0;
    background: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 20px 32px 72px;
    max-width: 860px;
    margin: 0 auto;
  }
  pre, code, kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  pre {
    background: rgba(127,127,127,0.12);
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
  }
  code {
    background: rgba(127,127,127,0.12);
    padding: 1px 5px;
    border-radius: 4px;
  }
  pre code {
    background: none;
    padding: 0;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    font-size: 13px;
  }
  th, td {
    border: 1px solid rgba(127,127,127,0.35);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: rgba(127,127,127,0.12);
  }
  blockquote {
    border-left: 3px solid rgba(127,127,127,0.5);
    margin: 1em 0;
    padding: 0.2em 1em;
    opacity: 0.8;
  }
  a { color: #0a84ff; }
  h1, h2, h3, h4 { line-height: 1.25; }
  h1 { font-size: 1.7em; }
  h2 { font-size: 1.35em; margin-top: 1.6em; }
  h3 { font-size: 1.12em; }
  hr {
    border: none;
    border-top: 1px solid rgba(127,127,127,0.3);
    margin: 2em 0;
  }
  #content.code-view pre {
    white-space: pre;
  }
</style>
</head>
<body>
<div id="content"></div>
<script>
  const RAW = %%CONTENT_JSON%%;
  const IS_CODE = %%IS_CODE%%;
  const el = document.getElementById('content');
  if (IS_CODE) {
    el.classList.add('code-view');
    const pre = document.createElement('pre');
    const codeEl = document.createElement('code');
    codeEl.textContent = RAW;
    pre.appendChild(codeEl);
    el.appendChild(pre);
  } else {
    el.innerHTML = marked.parse(RAW, { gfm: true, breaks: false });
  }
</script>
</body>
</html>
